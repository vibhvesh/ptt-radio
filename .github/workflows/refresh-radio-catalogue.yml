name: Refresh PTT Radio Catalogue
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ptt-radio-catalogue
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build public station catalogue
        run: python scripts/refresh_catalogue.py
      - name: Commit catalogue changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue/data/radio-directory.json
          git diff --cached --quiet || git commit -m "Refresh PTT radio catalogue"
          git push
